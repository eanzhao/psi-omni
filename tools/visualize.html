<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psi Agent Task Relationship Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        #taskGraph {
            width: 100%;
            height: 800px;
            border: 1px solid #ccc;
            background-color: #fff;
            margin-top: 20px;
        }
        #jsonInput {
            width: 100%;
            height: 200px;
            margin-bottom: 10px;
            font-family: monospace;
        }
        #errorMessage {
            color: red;
            margin-top: 10px;
            display: none;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #customTooltip {
            position: absolute;
            background-color: #333;
            color: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: none;
            font-size: 14px;
            max-width: 400px;
            z-index: 1000;
        }
        #customTooltip b {
            color: #FFD700;
        }
        .depth-indicator {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h2>Psi Agent Task Relationship Graph</h2>
    <p>Paste your JSON data below and click "Render Graph" to visualize the nested task relationships.</p>
    <textarea id="jsonInput" placeholder="Paste your JSON data here..."></textarea>
    <button onclick="renderGraph()">Render Graph</button>
    <div id="errorMessage"></div>
    <div id="taskGraph"></div>
    <div id="customTooltip"></div>

    <script>
        let network = null;
        const tooltip = document.getElementById('customTooltip');

        function renderGraph() {
            const jsonInput = document.getElementById('jsonInput').value;
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.style.display = 'none';

            let data;
            try {
                data = JSON.parse(jsonInput);
            } catch (e) {
                errorMessage.textContent = 'Error: Invalid JSON format. Please check your input.';
                errorMessage.style.display = 'block';
                return;
            }

            const nodes = new vis.DataSet();
            const edges = new vis.DataSet();
            const agentMap = new Map();
            data.forEach(agent => agentMap.set(agent.id, agent));

            const subtaskToNodeIdMap = new Map();
            data.forEach(agent => {
                if (agent.state.Orchestrator && agent.state.Orchestrator.CurrentSubTasks) {
                    agent.state.Orchestrator.CurrentSubTasks.forEach(subtask => {
                        const callback = (agent.state.Orchestrator.CompletedCallbacks || []).find(cb => cb.CallId === subtask.SubTaskId);
                        const childAgentId = callback ? callback.ChildAgentId : null;
                        if (childAgentId) {
                            subtaskToNodeIdMap.set(subtask.SubTaskId, childAgentId);
                        } else {
                            subtaskToNodeIdMap.set(subtask.SubTaskId, subtask.SubTaskId);
                        }
                    });
                }
            });

            const processedNodes = new Set();
            data.forEach(agent => {
                if (!processedNodes.has(agent.id)) {
                    nodes.add({
                        id: agent.id,
                        label: truncateLabel(agent.state.Task, 25),
                        shape: 'box',
                        color: getNodeColor(agent.depth),
                        tooltipContent: createTooltipContent(agent, agentMap),
                        widthConstraint: { maximum: 200 },
                        heightConstraint: { minimum: 60 }
                    });
                    processedNodes.add(agent.id);
                }

                if (agent.state.Orchestrator && agent.state.Orchestrator.CurrentSubTasks) {
                    agent.state.Orchestrator.CurrentSubTasks.forEach(subtask => {
                        const subtaskId = subtask.SubTaskId;
                        const representativeNodeId = subtaskToNodeIdMap.get(subtaskId);
                        
                        if (representativeNodeId === subtaskId && !processedNodes.has(subtaskId)) {
                            nodes.add({
                                id: subtaskId,
                                label: truncateLabel(subtask.ReframedTask || subtask.Task, 25),
                                shape: 'box',
                                color: getNodeColor(agent.depth + 1),
                                tooltipContent: createSubtaskTooltipContent(subtask, null),
                                widthConstraint: { maximum: 200 },
                                heightConstraint: { minimum: 60 }
                            });
                            processedNodes.add(subtaskId);
                        }
                    });
                }
            });

            const processedEdges = new Set();
            data.forEach(agent => {
                if (agent.state.ParentAgentId && agent.state.ParentAgentId !== '') {
                    const edgeId = `${agent.state.ParentAgentId}-${agent.id}`;
                    if (!processedEdges.has(edgeId)) {
                        edges.add({ from: agent.state.ParentAgentId, to: agent.id, arrows: 'to', color: '#007BFF', width: 2 });
                        processedEdges.add(edgeId);
                    }
                }

                if (agent.state.Orchestrator && agent.state.Orchestrator.CurrentSubTasks) {
                    agent.state.Orchestrator.CurrentSubTasks.forEach(subtask => {
                        const subtaskId = subtask.SubTaskId;
                        const toNodeId = subtaskToNodeIdMap.get(subtaskId);

                        const subtaskEdgeId = `${agent.id}-${toNodeId}`;
                        if (toNodeId && !processedEdges.has(subtaskEdgeId)) {
                            edges.add({ from: agent.id, to: toNodeId, arrows: 'to', color: '#28a745', width: 2 });
                            processedEdges.add(subtaskEdgeId);
                        }

                        Object.keys(subtask.DependencyResults || {}).forEach(depSubTaskId => {
                            const fromNodeId = subtaskToNodeIdMap.get(depSubTaskId);
                            const depEdgeId = `${fromNodeId}-${toNodeId}`;
                            if (fromNodeId && toNodeId && !processedEdges.has(depEdgeId)) {
                                edges.add({ from: fromNodeId, to: toNodeId, arrows: 'to', dashes: true, color: '#FF6200', width: 1 });
                                processedEdges.add(depEdgeId);
                            }
                        });
                    });
                }
            });

            const container = document.getElementById('taskGraph');
            const visData = { nodes, edges };
            const options = {
                layout: {
                    hierarchical: {
                        direction: 'UD',
                        sortMethod: 'directed',
                        levelSeparation: 150,
                        nodeSpacing: 200
                    }
                },
                edges: {
                    arrows: { to: { enabled: true, scaleFactor: 1 } },
                    font: { align: 'middle', color: '#333', size: 12 },
                    color: '#333',
                    width: 2
                },
                nodes: {
                    font: { size: 12, color: '#333' },
                    borderWidth: 2,
                    shape: 'box',
                    margin: 10
                },
                interaction: {
                    hover: true,
                    zoomView: true,
                    dragView: true
                },
                physics: false
            };

            if (network) {
                network.destroy();
            }
            network = new vis.Network(container, visData, options);

            network.on('hoverNode', function(params) {
                const node = nodes.get(params.node);
                tooltip.innerHTML = node.tooltipContent;
                tooltip.style.display = 'block';
                tooltip.style.left = (params.event.pageX + 10) + 'px';
                tooltip.style.top = (params.event.pageY + 10) + 'px';
            });

            network.on('blurNode', function() {
                tooltip.style.display = 'none';
            });
        }

        function getNodeColor(depth) {
            const colors = [
                '#FF9999', // Depth 0 - Red
                '#99CCFF', // Depth 1 - Blue
                '#99FF99', // Depth 2 - Green
                '#FFCC99', // Depth 3 - Orange
                '#CC99FF', // Depth 4 - Purple
                '#FFFF99', // Depth 5 - Yellow
                '#FF99CC', // Depth 6 - Pink
                '#99FFFF'  // Depth 7 - Cyan
            ];
            return colors[depth % colors.length];
        }

        function createTooltipContent(agent, agentMap) {
            const completedCallbacks = agent.state.Orchestrator?.CompletedCallbacks || [];
            const currentSubTasks = agent.state.Orchestrator?.CurrentSubTasks || [];
            
            let content = `<b>Task:</b><div style="max-height: 100px; overflow-y: auto; background-color: #444; padding: 5px; border-radius: 3px;">${escapeHtml(agent.state.Task)}</div>`;
            content += `<b>Agent ID:</b> ${agent.id}<br>`;
            content += `<b>Depth:</b> ${agent.depth}<br>`;
            content += `<b>SubTasks:</b> ${currentSubTasks.length}<br>`;
            content += `<b>Completed:</b> ${completedCallbacks.length}<br>`;
            
            if (completedCallbacks.length > 0) {
                const lastCallback = completedCallbacks[completedCallbacks.length - 1];
                content += `<b>Last Execution:</b> ${lastCallback.ExecutionTime}<br>`;
                content += `<b>Status:</b> ${lastCallback.IsSuccess ? 'Success' : 'Failed'}<br>`;
            }
            
            const chatHistory = agent.state.SpecializedState?.ChatHistory;
            if (chatHistory && chatHistory.length > 0) {
                content += `<hr><b>Chat History:</b><br>`;
                const historyText = chatHistory.map(msg => {
                    let msgContent = `<b>${msg.Role}:</b>`;
                    if (msg.Content) {
                        msgContent += ` ${escapeHtml(msg.Content)}`;
                    }
                    if (msg.ToolCalls && msg.ToolCalls.length > 0) {
                        const tools = msg.ToolCalls.map(tc => `[${tc.FunctionName}]`).join(' ');
                        msgContent += `<br><i>&rarr; Tools: ${tools}</i>`;
                    }
                    return msgContent;
                }).join('<br><br>');
                content += `<div style="max-height: 200px; overflow-y: auto; background-color: #444; padding: 5px; border-radius: 3px;">${historyText}</div>`;
            }

            return content;
        }

        function createSubtaskTooltipContent(subtask, childAgent) {
            let content = `<b>SubTask:</b><div style="max-height: 100px; overflow-y: auto; background-color: #444; padding: 5px; border-radius: 3px;">${escapeHtml(subtask.ReframedTask || subtask.Task)}</div>`;
            content += `<b>SubTask ID:</b> ${subtask.SubTaskId}<br>`;
            content += `<b>Status:</b> ${subtask.Status}<br>`;
            content += `<b>Priority:</b> ${subtask.Priority}<br>`;
            content += `<b>Can Start:</b> ${subtask.CanStart}<br>`;
            
            if (subtask.RequiredTools && subtask.RequiredTools.length > 0) {
                content += `<b>Required Tools:</b> ${subtask.RequiredTools.join(', ')}<br>`;
            }
            
            if (subtask.Dependencies && subtask.Dependencies.length > 0) {
                content += `<b>Dependencies:</b> ${subtask.Dependencies.join(', ')}<br>`;
            }
            
            if (childAgent) {
                const chatHistory = childAgent.state.SpecializedState?.ChatHistory;
                if (chatHistory && chatHistory.length > 0) {
                    content += `<hr><b>Chat History:</b><br>`;
                    const historyText = chatHistory.map(msg => {
                        let msgContent = `<b>${msg.Role}:</b>`;
                        if (msg.Content) {
                            msgContent += ` ${escapeHtml(msg.Content)}`;
                        }
                        if (msg.ToolCalls && msg.ToolCalls.length > 0) {
                            const tools = msg.ToolCalls.map(tc => `[${tc.FunctionName}]`).join(' ');
                            msgContent += `<br><i>&rarr; Tools: ${tools}</i>`;
                        }
                        return msgContent;
                    }).join('<br><br>');
                    content += `<div style="max-height: 300px; overflow-y: auto; background-color: #444; padding: 5px; border-radius: 3px;">${historyText}</div>`;
                }
            }
            
            return content;
        }

        function truncateLabel(text, maxLength) {
            // Remove markdown or special characters for cleaner labels
            const cleanText = text.replace(/###.*?\n|\n|\*\*.*?\*\*|[^a-zA-Z0-9\s.,%_-]/g, ' ').trim();
            return cleanText.length > maxLength ? cleanText.substring(0, maxLength - 3) + '...' : cleanText;
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
